<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Guías PC e IA 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: catálogo filtrable en grilla → ficha de propuesta con pestañas Resumen / Secuencia / Roles / Calendario */
:root{
  /* Paleta del cronograma Ceibal PC e IA: celeste de fondo, verde azulado, pasteles por área */
  --bg:#6DCBEF; --surface:#FFFFFF; --surface-2:#EAF6FB; --ink:#0B2533; --ink-2:#1D4357; --line:#BFE3F2;
  --accent:#007A68; --accent-ink:#FFFFFF; --accent-soft:#D6F1EC;
  --c-scratch:#5B3FB0; --c-scratch-bg:#E2D9FB;
  --c-microbit:#2F6E22; --c-microbit-bg:#D6EECB;
  --c-ia:#9E2F6C; --c-ia-bg:#F8D9EE;
  --c-internet:#2552A8; --c-internet-bg:#D7E5FD;
  --c-apps:#A64E14; --c-apps-bg:#FADCC6;
  --da:#007A68; --da-bg:#D6F1EC; --dr:#2552A8; --dr-bg:#DCE7FD;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.2vw,42px);font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.muted{color:var(--ink-2)}

/* catálogo */
.top{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.top p{max-width:64ch;color:var(--ink-2)}
.filters{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:22px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow .lbl{font-size:13px;font-weight:700;color:var(--ink-2);min-width:74px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}
.count{font-size:14px;color:var(--ink-2);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(19,40,58,.08)}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.card h3{font-size:19px}
.card p{font-size:14.5px;color:var(--ink)}
.card .meta{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:13px}
.lv{display:flex;flex-wrap:wrap;gap:6px}
.lvtag{background:var(--surface-2);border-radius:6px;padding:2px 7px;font-size:12.5px;font-variant-numeric:tabular-nums}
.status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.status.full{background:var(--accent-soft);color:var(--accent)}
.status.ficha{background:var(--surface-2);color:var(--ink-2)}
.status.edit{background:var(--c-apps-bg);color:var(--c-apps)}

/* ficha */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;margin-bottom:18px;color:var(--ink)}
.hero a,.facts a{color:var(--ink);font-weight:700}
body:not(.crono) .viewnav a{background:rgba(255,255,255,.55);border-color:transparent;color:var(--ink)}
body:not(.crono) .viewnav a[aria-current="page"]{background:var(--ink);color:#fff}
.top h1{display:inline-block;background:#fff;color:#00876F;border-radius:999px;padding:4px 26px 8px;align-self:flex-start}
.lvtag{background:rgba(255,255,255,.7)}
.card{border-color:transparent}
.card .cat{background:#fff!important}
.hero h1{display:inline-block;align-self:flex-start;background:#fff;color:#00876F;border-radius:999px;padding:4px 26px 8px}
.chip[aria-pressed="true"]{color:#fff}
.search{background:#fff}
.tabs .tab{color:var(--ink-2)}
.hero{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.hero .lead{font-size:18px;max-width:70ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14.5px}
.facts b{font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
section.panel{display:flex;flex-direction:column;gap:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.two,.three{grid-template-columns:1fr}}
ul.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:13.5px}
.eje{display:grid;grid-template-columns:200px 1fr;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.eje:first-of-type{border-top:0}
@media (max-width:640px){.eje{grid-template-columns:1fr;gap:4px}}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;counter-reset:e}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.stop .n{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--accent)}
.stop .c{font-size:12.5px;color:var(--ink-2)}

/* secuencia */
details.etapa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.etapa > summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:start}
details.etapa > summary::-webkit-details-marker{display:none}
.num{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.sum-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.sum-t .lines{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:14px;color:var(--ink-2)}
.tagw{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;align-self:start;margin-top:2px}
.tagw.aula{background:var(--da-bg);color:var(--da)}
.tagw.vc{background:var(--dr-bg);color:var(--dr)}
.chev{font-size:20px;color:var(--ink-2);transition:transform .2s}
details[open] .chev{transform:rotate(90deg)}
.ebody{padding:0 18px 18px;display:flex;flex-direction:column;gap:16px}
.col-aula{border-top:4px solid var(--da)}
.col-vc{border-top:4px solid var(--dr)}
.challenge{background:var(--dr-bg);border-radius:10px;padding:10px 12px;font-size:15px}
.moments{display:flex;flex-direction:column;gap:10px}
.mom{display:grid;grid-template-columns:110px 1fr;gap:10px}
.mom .mh{font-weight:700;font-size:14px}
.mom .bar{height:6px;border-radius:3px;background:var(--dr);margin-top:6px;opacity:.75}
.mom .mm{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
@media (max-width:520px){.mom{grid-template-columns:1fr}}
.subh{font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.note{font-size:14.5px;display:flex;gap:10px}
.note b{white-space:nowrap}
.flag{font-size:12px;font-weight:700;background:var(--c-apps-bg);color:var(--c-apps);padding:2px 8px;border-radius:6px}

/* roles */
.role-h{display:flex;align-items:center;gap:10px}
.badge{font-family:var(--f-display);font-weight:800;font-size:14px;padding:4px 9px;border-radius:8px}
.badge.da{background:var(--da-bg);color:var(--da)}
.badge.dr{background:var(--dr-bg);color:var(--dr)}
.badge.both{background:var(--surface-2);color:var(--ink)}
.rtable{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.rtable table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.rtable th,.rtable td{text-align:left;vertical-align:top;padding:12px;border-top:1px solid var(--line)}
.rtable thead th{border-top:0;background:var(--surface-2);font-size:13px}
.rtable td ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rtable td:first-child{font-weight:700;width:150px}

/* calendario */
.cal-ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:400;color:var(--ink)}
.weeks{display:flex;flex-direction:column;gap:10px}
.week{display:grid;grid-template-columns:130px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.week .wk{display:flex;flex-direction:column;gap:2px}
.week .wk b{font-family:var(--f-display);font-size:17px}
.week .wk span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.week .wc{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:14.5px}
.week.extra{border-style:dashed}
.prep{font-size:13.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
@media (max-width:560px){.week{grid-template-columns:1fr;gap:8px}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:700;text-decoration:none}
.foot{margin-top:40px;font-size:13px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* editor */
.edit-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.btn-sec{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 13px;font-weight:700;cursor:pointer}
.btn-sec:hover{border-color:var(--accent)}
.btn-sec.danger{color:#B3261E;border-color:currentColor}
button.btn{border:0;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.edited{background:var(--c-apps-bg);color:var(--c-apps);border-radius:8px;padding:4px 10px;font-weight:700}
.editor{display:flex;flex-direction:column;gap:18px}
.ed-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ed-bar .msg{font-size:14px;color:var(--ink-2)}
.ed-bar .msg.err{color:#B3261E}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.ed-grid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:13px;font-weight:700;color:var(--ink-2)}
.fld small{font-weight:400;color:var(--ink-2)}
.fld input,.fld textarea,.fld select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;resize:vertical}
.fld textarea{min-height:76px;line-height:1.45}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk input{width:auto}
details.ed-et{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.ed-et>summary{cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;list-style:none}
details.ed-et>summary::-webkit-details-marker{display:none}
.ed-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ed-sub{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding-top:6px;border-top:1px dashed var(--line)}
.ed-sub.aula{color:var(--da)}.ed-sub.vc{color:var(--dr)}
.ed-tools{display:flex;flex-wrap:wrap;gap:8px}
/* síntesis estilo guía */
:root{--syn-aula:#1F4E80;--syn-vc:#4C7D1C;--syn-on:#FFFFFF;--syn-arrow:#7DB33A;--syn-lbl:#1F4E80}
.syn-wrap{overflow-x:auto;padding-bottom:6px}
.syn{display:grid;gap:10px 12px;align-items:stretch;min-width:min-content}
.syn .lbl{border-radius:14px;display:grid;place-items:center;color:var(--syn-on);font-family:var(--f-display);font-weight:700;letter-spacing:.12em;writing-mode:vertical-rl;transform:rotate(180deg);font-size:15px;padding:10px 0}
.syn .lbl.aula{background:var(--syn-aula)}.syn .lbl.vc{background:var(--syn-vc)}
.syn .hd{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.syn .n{width:34px;height:34px;border-radius:50%;border:3px solid var(--syn-aula);background:var(--surface);color:var(--syn-lbl);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex:none}
.syn .wkd{font-size:12.5px;line-height:1.3;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.syn .wkd b{color:var(--ink);font-weight:700}
.syn .cell{border-radius:4px;padding:14px;color:var(--syn-on);display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.4}
.syn .cell h4{font-family:var(--f-display);font-size:15.5px;line-height:1.25;margin:0}
.syn .cell p{opacity:.92}
.syn .cell.aula{background:var(--syn-aula)}.syn .cell.vc{background:var(--syn-vc)}
.syn .cell .when{font-size:12px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.syn .arr{display:grid;place-items:center;color:var(--syn-arrow);font-size:22px;font-weight:800;line-height:1}
.syn .opt{font-size:11px;font-weight:700;background:rgba(255,255,255,.2);border-radius:5px;padding:1px 6px;align-self:flex-start}
.syn-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--ink-2);align-items:center}
.syn-legend span{display:inline-flex;gap:6px;align-items:center}
details.prepbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.prepbox summary{cursor:pointer;font-weight:700}
.prepl{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
/* cronograma anual */
:root{--cr-rosa:#FBE3F7;--cr-lila:#EBBBEB;--cr-violeta:#BBA9EF;--cr-azul:#A6C4FB;--cr-bebras:#A6CE9B;--cr-pres:#E9E2BC;--cr-vac:#C3E6EF;--cr-pa:#F0A27E;--cr-ink:#1B2433;--cr-head:#0E7A6A;--cr-head-ink:#FFFFFF;--cr-bar:#12222F}
.viewnav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.viewnav a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;background:var(--surface)}
.viewnav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cr-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.cr{display:grid;grid-template-columns:46px 92px repeat(33,minmax(40px,1fr));min-width:1560px;font-size:12.5px;color:var(--cr-ink)}
.cr>div{border-right:1px solid rgba(20,40,60,.12);border-bottom:1px solid rgba(20,40,60,.12);min-width:0}
.cr .mh{background:var(--surface);color:var(--cr-head);font-family:var(--f-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em;display:grid;place-items:center;padding:10px 2px}
.cr .sh{background:var(--cr-bar);color:#fff;font-weight:700;display:grid;place-items:center;padding:4px 0;font-variant-numeric:tabular-nums}
.cr .ch{background:var(--cr-head);color:var(--cr-head-ink);font-weight:700;display:grid;place-items:center;padding:4px 0;font-variant-numeric:tabular-nums}
.cr .ch.empty{background:#A7DCD3}
.cr .rl{font-size:10.5px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;padding-left:8px;grid-column:1/3}
.cr .sh.rl{justify-content:flex-start}.cr .ch.rl{justify-content:flex-start}
.cr .mh.rl{color:var(--cr-head);font-size:11px}
.cr .nv{background:var(--cr-head);color:#fff;font-family:var(--f-display);font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg);display:grid;place-items:center;font-size:15px;letter-spacing:.04em}
.cr .gr{background:var(--surface);color:var(--cr-head);font-family:var(--f-display);font-weight:800;font-size:22px;display:grid;place-items:center;text-align:center;line-height:1.1;padding:4px}
.cr .sg{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 6px;min-height:150px;line-height:1.3;font-weight:600}
.cr .sg.v span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;white-space:nowrap}
.cr .sg.mark{font-size:18px;font-weight:700}
.cr .sg a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}
.cr .sg a:hover{border-bottom-style:solid}
.cr .t-rosa{background:var(--cr-rosa)}.cr .t-lila{background:var(--cr-lila)}.cr .t-violeta{background:var(--cr-violeta)}.cr .t-azul{background:var(--cr-azul)}
.cr .t-pres,.cr .t-cierre{background:var(--cr-pres)}.cr .t-vac{background:var(--cr-vac)}.cr .t-bp,.cr .t-ba{background:var(--cr-bebras)}.cr .t-pa{background:var(--cr-pa)}
.cr .hl{outline:3px solid var(--cr-head);outline-offset:-3px}
.cr-legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--ink-2)}
.cr-legend b{color:var(--ink)}
.incr{display:flex;flex-wrap:wrap;gap:8px}
.incr a{font-size:13.5px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-decoration:none;font-weight:700}
/* cronograma: réplica visual */
body.crono{background:#6DCBEF}
body.crono .wrap{max-width:none}
body.crono .viewnav a{background:rgba(255,255,255,.55);border-color:transparent;color:#0B2533}
body.crono .viewnav a[aria-current="page"]{background:#0B2533;color:#fff}
.cr-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-bottom:6px}
.cr-title .pill{background:#fff;color:#00876F;border-radius:999px;padding:4px 26px 8px;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,52px);line-height:1.1}
.cr-title .pg{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,3.6vw,48px);color:#0B2533}

</style>

<div class="wrap" id="app">
  <p class="muted">Cargando propuestas…</p>
</div>

<script>
const CATS={
  scratch:{n:"Programación en Scratch",c:"--c-scratch"},
  microbit:{n:"Placas micro:bit",c:"--c-microbit"},
  ia:{n:"IA y datos",c:"--c-ia"},
  internet:{n:"Internet y seguridad",c:"--c-internet"},
  apps:{n:"Apps y realidad aumentada",c:"--c-apps"}
};
const NIV={"1":"Nivel 1","2":"Nivel 2","3":"Nivel 3","M":"Multigrado"};
const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes"];
let DATA=[], state={nivel:"all",cat:"all",q:"",tab:"resumen",editing:null};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const li=a=>(a&&a.length)?`<ul class="list">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="muted">—</p>`;
const catTag=k=>`<span class="cat" style="background:var(${CATS[k].c}-bg);color:var(${CATS[k].c})"><span class="dot" style="background:var(${CATS[k].c})"></span>${CATS[k].n}</span>`;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

fetch("guias.json").then(r=>r.json()).then(d=>{DATA=d;DATA.forEach(g=>{g.base=g.detalle;if(g.publicado&&g.publicado.detalle){g.detalle=g.publicado.detalle;g.ed={at:g.publicado.updatedAt,name:g.publicado.responsable||""}}});route();initDb()}).catch(()=>{app.innerHTML='<p>No se pudieron cargar las propuestas.</p>'});
window.addEventListener("hashchange",()=>{state.tab="resumen";state.editing=null;route()});

function route(keepScroll){
  const id=location.hash.slice(1);
  document.body.classList.toggle("crono",id==="cronograma"||id.startsWith("cronograma-"));
  if(id==="configurar"){renderSetup();if(!keepScroll)window.scrollTo(0,0);return}
  if(id==="acceso"){renderLogin();if(!keepScroll)window.scrollTo(0,0);return}
  if(id==="cronograma"||id.startsWith("cronograma-")){renderCrono(id.slice(11)||null);if(!keepScroll)window.scrollTo(0,0);return}
  const g=DATA.find(x=>x.id===id);
  if(g&&state.editing&&state.editing.id===g.id)renderEditor(g);
  else g?renderGuia(g):renderCatalogo();
  if(!keepScroll)window.scrollTo(0,0);
}

/* ---------- catálogo ---------- */
function renderCatalogo(){
  const full=DATA.filter(g=>g.detalle).length;
  app.innerHTML=`${viewNav("prop")}
  <header class="top">
    <span class="eyebrow">Ceibal · Pensamiento Computacional e IA · Propuestas 2027</span>
    <h1>Guías docentes, etapa por etapa</h1>
    <p>Elegí una propuesta para ver de qué se trata, cómo avanza cada etapa en el aula y en la videoconferencia, qué hace el docente de aula (DA) y el docente remoto (DR), y un calendario semana a semana.</p>
  </header>
  <div class="filters">
    <div class="frow"><span class="lbl">Nivel</span>${["all","1","2","3","M"].map(n=>`<button class="chip" data-f="nivel" data-v="${n}" aria-pressed="${state.nivel===n}">${n==="all"?"Todos":NIV[n]}</button>`).join("")}</div>
    <div class="frow"><span class="lbl">Área</span><button class="chip" data-f="cat" data-v="all" aria-pressed="${state.cat==="all"}">Todas</button>${Object.entries(CATS).map(([k,v])=>`<button class="chip" data-f="cat" data-v="${k}" aria-pressed="${state.cat===k}"><span class="dot" style="background:var(${v.c})"></span>${v.n}</button>`).join("")}</div>
    <div class="frow"><span class="lbl">Buscar</span><input class="search" id="q" type="search" placeholder="Nombre, contenido o tema de clase" value="${esc(state.q)}"></div>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="foot">${full} de ${DATA.length} propuestas tienen la secuencia completa cargada; el resto muestra la ficha y el enlace a la guía en PDF.${` · <a href="#acceso">${GH.auth?"Edición activa ("+esc(GH.auth.name)+")":"Edición"}</a>`}</p>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state[b.dataset.f]=b.dataset.v;renderCatalogo()});
  const q=document.getElementById("q");
  q.oninput=()=>{state.q=q.value;drawGrid()};
  drawGrid();
}
function drawGrid(){
  const q=state.q.trim().toLowerCase();
  const list=DATA.filter(g=>(state.nivel==="all"||g.niveles.some(n=>n.nivel===state.nivel))&&(state.cat==="all"||g.cat===state.cat)&&(!q||[g.nombre,g.resumen,...g.tags,g.materiales].join(" ").toLowerCase().includes(q)));
  document.getElementById("count").textContent=`${list.length} propuesta${list.length===1?"":"s"}`;
  document.getElementById("grid").innerHTML=list.map(g=>`
    <a class="card" href="#${g.id}" style="background:var(${CATS[g.cat].c}-bg)">
      <div class="head">${catTag(g.cat)}<span class="status ${g.ed?"edit":g.detalle?"full":"ficha"}">${g.ed?"Editada":g.detalle?"Secuencia":"Solo ficha"}</span></div>
      <h3>${esc(g.nombre)}</h3>
      <p>${esc(g.resumen)}</p>
      <div class="meta">
        <div class="lv">${g.niveles.map(n=>`<span class="lvtag">${n.nivel==="M"?"Multigrado":NIV[n.nivel]+" · "+esc(n.grados)}</span>`).join("")}</div>
        <span class="muted">${esc(g.duracion)} · ${esc(g.materiales)}</span>
      </div>
    </a>`).join("")||`<p class="muted">No hay propuestas con esos filtros.</p>`;
}

/* ---------- ficha ---------- */
function renderGuia(g){
  const d=g.detalle;
  const tabs=d?[["resumen","Resumen"],["secuencia","Secuencia"],["roles","Roles DA / DR"],["calendario","Síntesis de etapas"]]:[];
  app.innerHTML=`
  <a class="back" href="#">← Todas las propuestas</a>
  <header class="hero">
    <div>${catTag(g.cat)}</div>
    <h1>${esc(g.nombre)}</h1>
    <p class="lead">${esc(d?d.intro:g.resumen)}</p>
    <div class="facts">
      <span><b>Niveles:</b> ${g.niveles.map(n=>n.nivel==="M"?"Multigrado":NIV[n.nivel]+" ("+esc(n.grados)+")").join(", ")}</span>
      <span><b>Duración:</b> ${esc(g.duracion)}</span>
      <span><b>Materiales:</b> ${esc(g.materiales)}</span>
      ${d?`<span><b>Etapas:</b> ${d.etapas.length}</span>`:""}
      <span><b>Se vincula con:</b> ${g.tags.map(esc).join(", ")}</span>
      ${g.pdf?`<a href="${g.pdf}" target="_blank" rel="noopener">Guía original (PDF) ↗</a>`:""}
    </div>
    ${enCrono(g).length?`<div class="incr"><span class="muted" style="font-size:13.5px;align-self:center">En el cronograma:</span>${enCrono(g).map(t=>`<a href="#cronograma-${g.id}">${esc(t)}</a>`).join("")}</div>`:""}
    ${editRow(g)}
  </header>
  ${d?`<nav class="tabs" role="tablist">${tabs.map(([k,v])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${state.tab===k}">${v}</button>`).join("")}</nav><div id="panel"></div>`
     :`<div class="empty"><h3>La secuencia de esta propuesta todavía no está cargada</h3><p class="muted">Mientras tanto, la guía completa está disponible en PDF.</p>${g.pdf?`<a class="btn" href="${g.pdf}" target="_blank" rel="noopener">Abrir guía docente ↗</a>`:`<p class="muted">No hay guía docente en la carpeta para esta propuesta.</p>`}</div>`}`;
  bindEditRow(g);
  if(!d)return;
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;app.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));drawPanel(g)});
  drawPanel(g);
}
function drawPanel(g){
  const p=document.getElementById("panel");
  p.innerHTML=({resumen:pResumen,secuencia:pSecuencia,roles:pRoles,calendario:pCalendario})[state.tab](g);
  if(state.tab==="calendario")bindCal(g);
}

function pResumen(g){
  const d=g.detalle;
  return `<section class="panel">
    <div class="box"><h3>Recorrido en etapas</h3>
      <div class="route">${d.etapas.map((e,i)=>`<div class="stop"><span class="n">Etapa ${i+1}${e.extraVC?" · "+(e.extraVC===true?2:e.extraVC+1)+" VC":""}${e.opcional?" · opcional":""}</span><b>${esc(e.titulo)}</b><span class="c">${esc(e.concepto)}</span></div>`).join("")}</div>
    </div>
    <div class="two">
      <div class="box"><h3>Contenidos de PC</h3><div class="pills">${d.contenidosPC.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div>
        ${d.practicas?`<h3 style="margin-top:8px">Prácticas computacionales</h3><div class="pills">${d.practicas.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div>`:""}
      </div>
      <div class="box"><h3>Qué se necesita</h3>${li(d.requisitos)}</div>
    </div>
    <div class="box"><h3>Objetivos de aprendizaje</h3>${d.objetivos.map(o=>`<div class="eje"><b>${esc(o.eje)}</b><p>${esc(o.texto)}</p></div>`).join("")}</div>
    ${d.vinculaciones?`<div class="box"><h3>Posibles vinculaciones curriculares</h3><p class="muted" style="font-size:14px">Las define el maestro o la maestra de aula.</p>${d.vinculaciones.map(o=>`<div class="eje"><b>${esc(o.area)}</b><p>${esc(o.texto)}</p></div>`).join("")}</div>`:""}
    ${d.genero?`<div class="box"><h3>Perspectiva de género</h3><p>${esc(d.genero)}</p></div>`:""}
  </section>`;
}

function pSecuencia(g){
  const d=g.detalle;
  return `<section class="panel"><p class="muted">Cada etapa tiene una actividad en el aula con el DA y una videoconferencia (VC) con el DR. Tocá una etapa para ver el detalle.</p>
  ${d.etapas.map((e,i)=>`
  <details class="etapa"${i===0?" open":""}>
    <summary>
      <span class="num">${i+1}</span>
      <span class="sum-t"><h3>${esc(e.titulo)} ${e.extraVC?'<span class="flag">puede requerir '+(e.extraVC===true?2:e.extraVC+1)+' VC</span>':""} ${e.opcional?'<span class="flag">opcional</span>':""}</h3>
        <span class="lines"><span class="tagw aula">Aula</span><span>${esc(e.sintesisAula)}</span><span class="tagw vc">VC</span><span>${esc(e.sintesisVC)}</span></span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </summary>
    <div class="ebody">
      <div><span class="subh">Se espera que los estudiantes</span>${li(e.objetivos)}</div>
      <div class="two">
        <div class="box col-aula"><span class="eyebrow" style="color:var(--da)">Aula · con el DA</span><h3>${esc(e.aula.titulo)}</h3>
          <p>${esc(e.aula.detalle)}</p>
          <span class="subh">Propósitos mínimos</span>${li(e.aula.minimos)}
          ${e.aula.optimos&&e.aula.optimos.length?`<span class="subh">Propósitos óptimos</span>${li(e.aula.optimos)}`:""}
        </div>
        <div class="box col-vc"><span class="eyebrow" style="color:var(--dr)">Videoconferencia · con el DR</span><h3>${esc(e.vc.titulo)}</h3>
          ${e.vc.desafio?`<div class="challenge"><b>Desafío:</b> ${esc(e.vc.desafio)}</div>`:""}
          <div class="moments">${e.vc.momentos.map(m=>`<div class="mom"><div><div class="mh">${esc(m.nombre)}</div>${m.min?`<div class="mm">${m.min} min</div><div class="bar" style="width:${Math.min(100,m.min/45*100)}%"></div>`:""}</div><p>${esc(m.texto)}</p></div>`).join("")}</div>
        </div>
      </div>
      ${e.registro?`<p class="note"><b>Registro en Crea</b><span>${esc(e.registro)}</span></p>`:""}
      ${e.yapa?`<p class="note"><b>La Yapa 🏡</b><span>${esc(e.yapa)}</span></p>`:""}
    </div>
  </details>`).join("")}</section>`;
}

function pRoles(g){
  const r=g.detalle.roles, E=g.detalle.etapas;
  return `<section class="panel">
    <div class="two">
      <div class="box"><div class="role-h"><span class="badge da">DA</span><h3>Docente de aula</h3></div>${li(r.da)}
        ${r.daComunica?`<span class="subh">Comunica al DR al empezar</span>${li(r.daComunica)}`:""}</div>
      <div class="box"><div class="role-h"><span class="badge dr">DR</span><h3>Docente remoto</h3></div>${li(r.dr)}
        ${r.drComunica?`<span class="subh">Comunica al DA</span>${li(r.drComunica)}`:""}
        ${r.drNecesita?`<span class="subh">Necesita saber</span>${li(r.drNecesita)}`:""}</div>
    </div>
    <div><h2 style="margin-bottom:12px">Coordinación etapa por etapa</h2>
    <div class="rtable"><table>
      <thead><tr><th>Etapa</th><th><span class="badge both">DA + DR</span> Deciden juntos</th><th><span class="badge da">DA</span> Decide</th><th><span class="badge dr">DR</span> Necesita saber</th></tr></thead>
      <tbody>${E.map((e,i)=>`<tr><td>${i+1}. ${esc(e.titulo)}</td><td>${li(e.conjuntas)}</td><td>${li(e.da)}</td><td>${li(e.drNecesita)}</td></tr>`).join("")}</tbody>
    </table></div></div>
  </section>`;
}

function weeksOf(g){
  const w=[];g.detalle.etapas.forEach((e,i)=>{w.push({e,i,extra:false});const n=e.extraVC===true?1:(e.extraVC||0);for(let k=0;k<n;k++)w.push({e,i,extra:true})});return w;
}
const TIMER=`<svg width="26" height="26" viewBox="0 0 26 26" aria-label="Más de un módulo de 45 min" role="img"><g fill="none" stroke="var(--syn-arrow)" stroke-width="2.2" stroke-linecap="round"><circle cx="13" cy="15" r="7.5"/><path d="M13 15V11M11 4.5h4M13 4.5v3M4.5 5.5 6.5 7.5M21.5 5.5 19.5 7.5M3 11h1.5M23 11h-1.5"/></g></svg>`;
function pCalendario(g){
  const start=store("cal-start")||"2027-03-01", day=store("cal-day")||"0";
  return `<section class="panel">
    <p class="muted" id="cal-sum" style="font-size:15px"></p>
    ${enCrono(g).length?`<div class="incr"><span class="muted" style="font-size:13.5px;align-self:center">Ubicación en el cronograma anual:</span>${enCrono(g).map(t=>`<a href="#cronograma-${g.id}">${esc(t)}</a>`).join("")}</div>`:""}
    <div class="syn-legend"><span>${TIMER} La VC está prevista para más de un módulo de 45 min</span><span>La actividad de aula se hace antes de la VC de esa semana.</span></div>
    <div class="syn-wrap"><div class="syn" id="syn"></div></div>
    <details class="prepbox"><summary>Qué avisa el DA al DR antes de cada VC</summary><ol class="prepl" id="prep"></ol></details>
  </section>`;
}
function bindCal(g){
  const draw=()=>{
    const E=g.detalle.etapas;
    let wk=0;
    const cols=E.map((e,i)=>{
      const n=1+(e.extraVC===true?1:(e.extraVC||0));
      const c={e,i,n,w0:wk+1,w1:wk+n};wk+=n;return c;
    });
    const N=cols.length;
    const syn=document.getElementById("syn");
    syn.style.gridTemplateColumns=`44px repeat(${N}, minmax(190px, 1fr))`;
    syn.style.gridTemplateRows="auto auto auto auto";
    const hd=cols.map(c=>`<div class="hd"><span class="n">${c.i+1}</span><span class="wkd"><b>${c.n>1?`Semanas ${c.w0}–${c.w1}`:`Semana ${c.w0}`}</b></span>${c.n>1?TIMER:""}</div>`).join("");
    const aula=cols.map(c=>`<div class="cell aula">${c.e.opcional?'<span class="opt">Etapa opcional</span>':""}<h4>${esc(c.e.aula.titulo||c.e.titulo)}</h4><p>${esc(c.e.sintesisAula)}</p></div>`).join("");
    const arr=cols.map(()=>`<div class="arr" aria-hidden="true">↓</div>`).join("");
    const vc=cols.map(c=>`<div class="cell vc"><span class="when">VC${c.n>1?" · "+c.n+" encuentros":""}</span><h4>${esc(c.e.vc.titulo||c.e.titulo)}</h4><p>${esc(c.e.sintesisVC)}</p></div>`).join("");
    syn.innerHTML=`<div></div>${hd}<div class="lbl aula">AULA</div>${aula}<div></div>${arr}<div class="lbl vc">VC</div>${vc}`;
    document.getElementById("cal-sum").textContent=`${wk} semanas con una VC semanal${E.some(e=>e.opcional)?" (incluye etapas opcionales)":""}. La guía estima ${g.duracion}.`;
    document.getElementById("prep").innerHTML=cols.map(c=>`<li><b>${esc(c.e.titulo)}</b> (${c.n>1?`semanas ${c.w0}–${c.w1}`:`semana ${c.w0}`}): ${(c.e.drNecesita&&c.e.drNecesita.length)?c.e.drNecesita.map(esc).join(" · "):"sin indicaciones particulares"}</li>`).join("");
  };
  draw();
}

/* ---------- edición compartida ---------- */
let DB=null, USER=null, CANWRITE=false, OVR={}, NAMES={};
function applyOverrides(){
  DATA.forEach(g=>{const o=OVR[g.id];g.detalle=o?o.detalle:g.base;g.ed=o?{at:o.updatedAt,by:o.updatedBy,name:o.responsable||""}:null});
}
async function initDb(){
  try{ if(!window.claude||!claude.use)return; DB=await claude.use("db"); USER=await claude.use("user"); }catch(e){DB=null}
  if(!DB)return;
  try{CANWRITE=USER?((await USER.isOwner())??false):false}catch(e){CANWRITE=false}
  DB.collection("ediciones").onSnapshot(snap=>{
    OVR={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.detalle)OVR[d.id]=v});
    applyOverrides();resolveNames();
    if(!state.editing)route(true);
  },()=>{});
  if(!state.editing)route(true);
}
async function resolveNames(){
  const ids=[...new Set(Object.values(OVR).map(o=>o.updatedBy).filter(Boolean))];
  if(!ids.length||!USER)return;
  try{const ps=await USER.profiles(ids);ids.forEach(i=>NAMES[i]=(ps[i]&&ps[i].name)||"");if(!state.editing)route(true)}catch(e){}
}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString("es-UY",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function editRow(g){
  const badge=g.ed?`<span class="edited">Editada${g.ed.at?" el "+esc(fmtDate(g.ed.at)):""}${(g.ed.name||NAMES[g.ed.by])?" por "+esc(g.ed.name||NAMES[g.ed.by]):""}</span>`:"";
  const btn=((DB&&CANWRITE)||GH.auth)?`<button class="btn-sec" id="btn-edit" type="button">✎ ${g.detalle?"Editar secuencia":"Crear secuencia"}</button>`:"";
  return (badge||btn)?`<div class="edit-row">${badge}${btn}</div>`:"";
}
function bindEditRow(g){
  const b=document.getElementById("btn-edit"); if(!b)return;
  b.onclick=()=>{state.editing={id:g.id,draft:JSON.parse(JSON.stringify(g.detalle||blankDetalle())),open:0,resp:(GH.auth&&GH.auth.name)||store("ed-resp")||""};renderEditor(g);window.scrollTo(0,0)};
}
function blankEtapa(){return {titulo:"Nueva etapa",concepto:"",sintesisAula:"",sintesisVC:"",objetivos:[],conjuntas:[],da:[],drNecesita:[],

/* helpers de campos */
const L=a=>(a||[]).join("\n");
const parseL=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);
const M=a=>(a||[]).map(m=>`${m.nombre} | ${m.min??""} | ${m.texto}`).join("\n");
const parseM=t=>parseL(t).map(l=>{const p=l.split("|");return p.length>=3?{nombre:p[0].trim(),min:parseInt(p[1])||null,texto:p.slice(2).join("|").trim()}:{nombre:"Momento",min:null,texto:l}});
const O=a=>(a||[]).map(o=>`${o.eje} | ${o.texto}`).join("\n");
const parseO=t=>parseL(t).map(l=>{const i=l.indexOf("|");return i>0?{eje:l.slice(0,i).trim(),texto:l.slice(i+1).trim()}:{eje:"",texto:l}});
function getP(o,path){return path.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,path,v){const ks=path.split(".");let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null)a[k]={};a=a[k]});a[ks[ks.length-1]]=v}
const FMT={text:v=>v??"",lines:L,mom:M,obj:O,num:v=>v===true?1:(v||0)};
const PARSE={text:v=>v,lines:parseL,mom:parseM,obj:parseO,num:v=>{const n=Math.max(0,Math.min(4,parseInt(v)||0));return n||undefined}};
function fld(scope,path,label,type="text",opts={}){
  const id=`f-${scope}-${path.replace(/\./g,"_")}`;
  const base=scope==="g"?state.editing.draft:state.editing.draft.etapas[scope];
  const v=type==="bool"?"":FMT[type](getP(base,path));
  const hint=opts.hint?` <small>${opts.hint}</small>`:"";
  const attrs=`id="${id}" data-s="${scope}" data-p="${path}" data-t="${type}"`;
  if(type==="bool")return `<label class="fld chk" for="${id}"><input type="checkbox" ${attrs} ${getP(base,path)?"checked":""}><span>${label}</span></label>`;
  if(type==="num")return `<label class="fld" for="${id}"><span>${label}${hint}</span><input type="number" min="0" max="4" ${attrs} value="${esc(v)}"></label>`;
  const big=type!=="text"||opts.area;
  return `<label class="fld" for="${id}"><span>${label}${hint}</span>${big?`<textarea ${attrs} rows="${opts.rows||3}">${esc(v)}</textarea>`:`<input type="text" ${attrs} value="${esc(v)}">`}</label>`;
}

/* ---------- edición: 3 usuarios, cada uno con su contraseña ----------
   edicion.json guarda la llave de GitHub cifrada con una clave interna; esa clave
   está a su vez cifrada con el usuario y la contraseña de cada persona.
   En el sitio no hay contraseñas ni llaves legibles. */
const USERS=["Enzo","Pedagogico","Ro"], ITER=600000;
const REPO={owner:"esguillaro-ai",repo:"guias-pc-ia-2027",branch:"main"};
const GH={cfg:null,auth:null};
const tenc=new TextEncoder(),tdec=new TextDecoder();
const b64=u=>{const a=new Uint8Array(u);let s="";for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64utf8=str=>b64(tenc.encode(str)), utf8b64=s=>tdec.decode(unb64(s));
async function pwKey(name,pass,salt,iter){
  const km=await crypto.subtle.importKey("raw",tenc.encode(name.toLowerCase()+"\n"+pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
const aesKey=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
async function seal(key,bytes){const iv=rnd(12);return {iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes))}}
async function unseal(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct)))}
async function wrapUser(name,pass,K){const salt=rnd(16);return {salt:b64(salt),iter:ITER,...await seal(await pwKey(name,pass,salt,ITER),K)}}
function saveSession(){try{GH.auth?sessionStorage.setItem("gh-auth",JSON.stringify(GH.auth)):sessionStorage.removeItem("gh-auth")}catch(e){}}
try{const a=sessionStorage.getItem("gh-auth");if(a)GH.auth=JSON.parse(a)}catch(e){}
fetch("edicion.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{
  if(c&&c.v===2&&c.users)GH.cfg=c; else {GH.auth=null;saveSession()}
  if(!state.editing&&DATA.length)route(true);
}).catch(()=>{});

async function ghLogin(name,pass){
  const c=GH.cfg, key=Object.keys(c.users).find(n=>n.toLowerCase()===name.trim().toLowerCase());
  if(!key)throw {code:"cred"};
  const u=c.users[key];
  let K;try{K=await unseal(await pwKey(key,pass,unb64(u.salt),u.iter),u)}catch(e){throw {code:"cred"}}
  const token=c.token?tdec.decode(await unseal(await aesKey(K),c.token)):null;
  return {name:key,token,K:b64(K),owner:c.owner,repo:c.repo,branch:c.branch};
}
async function ghCheck(token){
  const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}`,{headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"},cache:"no-store"});
  if(!r.ok)throw {status:r.status};
  const j=await r.json(); if(!(j.permissions&&j.permissions.push))throw {status:403};
  return j.default_branch||REPO.branch;
}
const ghUrl=(a,path)=>`https://api.github.com/repos/${encodeURIComponent(a.owner)}/${encodeURIComponent(a.repo)}/contents/${path}`;
const ghHead=a=>({Authorization:`Bearer ${a.token}`,Accept:"application/vnd.github+json"});
async function ghGet(path,a=GH.auth){
  const r=await fetch(ghUrl(a,path)+"?ref="+encodeURIComponent(a.branch),{headers:ghHead(a),cache:"no-store"});
  if(r.status===404)return null; if(!r.ok)throw {status:r.status};
  const j=await r.json(); return {sha:j.sha,text:utf8b64(j.content)};
}
async function ghPut(path,text,message,sha,a=GH.auth){
  const body={message,content:b64utf8(text),branch:a.branch}; if(sha)body.sha=sha;
  const r=await fetch(ghUrl(a,path),{method:"PUT",headers:{...ghHead(a),"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw {status:r.status};
}
async function ghCommit(mutate,message){
  if(!GH.auth||!GH.auth.token)throw {status:"notoken"};
  const f=await ghGet("guias.json"); if(!f)throw {status:404};
  const arr=JSON.parse(f.text); mutate(arr);
  await ghPut("guias.json","[\n"+arr.map(x=>JSON.stringify(x)).join(",\n")+"\n]\n",message,f.sha);
}
async function saveCfg(cfg,message,a=GH.auth){
  if(!a||!a.token)throw {status:"notoken"};
  const cur=await ghGet("edicion.json",a);
  await ghPut("edicion.json",JSON.stringify(cfg,null,1)+"\n",message,cur&&cur.sha,a);
  GH.cfg=cfg;
}
function ghErr(e){
  const s=e&&e.status;
  if(s==="notoken")return "Falta conectar la web con GitHub (una sola vez). Entrá a Edición, al pie del catálogo.";
  if(s===401)return "La llave de GitHub venció o fue revocada. Renovala en Edición → Renovar la llave de GitHub.";
  if(s===403||s===404)return "La llave de GitHub no tiene permiso para escribir en el repositorio.";
  if(s===409||s===422)return "El archivo cambió mientras editabas. Volvé a intentar.";
  return "No se pudo guardar. Revisá la conexión y volvé a intentar.";
}
async function ghSave(g,d,resp){
  const pub={detalle:d,updatedAt:new Date().toISOString(),responsable:resp};
  await ghCommit(arr=>{const x=arr.find(y=>y.id===g.id);if(!x)throw {status:0};x.publicado=pub},`Edición de ${g.nombre} por ${resp}`);
  g.publicado=pub;g.detalle=d;g.ed={at:pub.updatedAt,name:resp};
}
async function ghRestore(g){
  await ghCommit(arr=>{const x=arr.find(y=>y.id===g.id);if(x)delete x.publicado},`Restaurar ${g.nombre} a la versión de la guía (${GH.auth.name})`);
  delete g.publicado;g.detalle=g.base;g.ed=null;
}

/* pantallas */
const pwField=(id,label,ac="new-password")=>`<label class="fld" for="${id}"><span>${label}</span><input id="${id}" type="password" autocomplete="${ac}" required minlength="12"></label>`;
const tokenHelp=`<details><summary>¿Cómo creo la llave de GitHub?</summary><ol class="list" style="margin-top:8px">
  <li>En GitHub: tu foto → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>
  <li>Repository access: <b>Only select repositories</b> → ${REPO.owner}/${REPO.repo}.</li>
  <li>Permissions → Repository permissions → <b>Contents: Read and write</b>.</li>
  <li>Elegí el vencimiento más largo posible, generala y copiala.</li></ol></details>`;
function setMsg(el,t,err){el.textContent=t;el.style.color=err?"#B3261E":"var(--accent)"}
function checkPw(p1,p2){if(p1.length<12)return "La contraseña tiene que tener al menos 12 caracteres.";if(p1!==p2)return "Las contraseñas no coinciden.";return ""}

function renderSetup(){
  if(GH.cfg){app.innerHTML=`${viewNav("")}<section class="box" style="max-width:520px"><h2>La edición ya está configurada</h2><p>Ingresá con tu usuario en <a href="#acceso">Acceso para edición</a>. Desde ahí se cambian contraseñas y se renueva la llave.</p></section>`;return}
  app.innerHTML=`${viewNav("")}<form class="box" id="su" style="max-width:600px">
    <h2>Configurar la edición</h2>
    <p class="muted">Se hace una sola vez. La llave de GitHub queda cifrada en el repositorio y solo se abre con alguno de los tres usuarios. Las contraseñas no se guardan en ningún lado.</p>
    <label class="fld" for="su-t"><span>Llave de GitHub <small>empieza con github_pat_</small></span><input id="su-t" type="password" autocomplete="off" spellcheck="false" required></label>
    ${tokenHelp}
    ${USERS.map((u,i)=>`<fieldset class="box" style="padding:12px;gap:8px"><legend><b>${u}</b></legend><div class="ed-grid">${pwField("su-p"+i,"Contraseña")}${pwField("su-q"+i,"Repetir contraseña")}</div></fieldset>`).join("")}
    <p class="muted" style="font-size:14px">Mínimo 12 caracteres cada una. Después cada persona puede cambiar la suya.</p>
    <p id="su-m" role="status" style="font-size:14px"></p>
    <div class="ed-tools"><button class="btn" type="submit" id="su-b">Guardar configuración</button><a class="btn-sec" href="#">Cancelar</a></div>
  </form>`;
  const f=document.getElementById("su"),m=document.getElementById("su-m"),b=document.getElementById("su-b");
  f.onsubmit=async ev=>{ev.preventDefault();
    const pw=USERS.map((u,i)=>[document.getElementById("su-p"+i).value,document.getElementById("su-q"+i).value]);
    for(let i=0;i<USERS.length;i++){const e=checkPw(...pw[i]);if(e){setMsg(m,`${USERS[i]}: ${e}`,true);return}}
    const token=document.getElementById("su-t").value.trim();
    b.disabled=true;setMsg(m,"Verificando la llave…");
    try{
      const branch=await ghCheck(token);
      setMsg(m,"Cifrando… (tarda unos segundos)");
      const K=rnd(32),users={};
      for(let i=0;i<USERS.length;i++)users[USERS[i]]=await wrapUser(USERS[i],pw[i][0],K);
      const cfg={v:2,owner:REPO.owner,repo:REPO.repo,branch,users,token:await seal(await aesKey(K),tenc.encode(token))};
      setMsg(m,"Guardando en el repositorio…");
      await saveCfg(cfg,"Configurar la edición desde la web",{token,owner:REPO.owner,repo:REPO.repo,branch});
      GH.auth=null;saveSession();
      app.innerHTML=`${viewNav("")}<section class="box" style="max-width:520px"><h2>Listo</h2><p>La edición quedó configurada para ${USERS.join(", ")}. Ya pueden ingresar en <a href="#acceso">Acceso para edición</a>.</p></section>`;
    }catch(e){b.disabled=false;setMsg(m,e&&e.status===401?"La llave no es válida o venció.":e&&(e.status===403||e.status===404)?"Esa llave no puede escribir en este repositorio.":"No se pudo guardar. Revisá la conexión.",true)}
  };
}

function renderLogin(){
  if(!GH.cfg){app.innerHTML=`${viewNav("")}<section class="box" style="max-width:520px"><h2>Acceso para edición</h2><p class="muted">La edición todavía no está configurada.</p><div class="ed-tools"><a class="btn" href="#configurar">Configurar la edición</a></div></section>`;return}
  if(GH.auth){renderAdmin();return}
  app.innerHTML=`${viewNav("")}<form class="box" id="lg" style="max-width:420px">
    <h2>Acceso para edición</h2>
    <label class="fld" for="lg-u"><span>Usuario</span><select id="lg-u" required>${Object.keys(GH.cfg.users).map(n=>`<option>${esc(n)}</option>`).join("")}</select></label>
    ${pwField("lg-p","Contraseña","current-password")}
    <p class="msg" id="lg-m" role="status" style="font-size:14px"></p>
    <div class="ed-tools"><button class="btn" type="submit" id="lg-b">Ingresar</button><a class="btn-sec" href="#">Cancelar</a></div>
  </form>`;
  const f=document.getElementById("lg"),m=document.getElementById("lg-m"),b=document.getElementById("lg-b");
  try{const last=localStorage.getItem("ed-user");if(last)document.getElementById("lg-u").value=last}catch(e){}
  document.getElementById("lg-p").removeAttribute("minlength");
  f.onsubmit=async ev=>{ev.preventDefault();b.disabled=true;setMsg(m,"Verificando…");
    const u=document.getElementById("lg-u").value;
    try{GH.auth=await ghLogin(u,document.getElementById("lg-p").value);saveSession();
      try{localStorage.setItem("ed-user",GH.auth.name)}catch(e){}
      location.hash="";}
    catch(e){b.disabled=false;setMsg(m,"Usuario o contraseña incorrectos.",true)}};
  document.getElementById("lg-p").focus();
}

function renderAdmin(){
  const names=Object.keys(GH.cfg.users);
  app.innerHTML=`${viewNav("")}<div style="display:flex;flex-direction:column;gap:16px;max-width:600px">
    <section class="box"><h2>Edición activa · ${esc(GH.auth.name)}</h2><p>En cada propuesta vas a ver el botón <b>Editar secuencia</b>. Al guardar, la web se actualiza en 1 o 2 minutos.</p>
      <div class="ed-tools"><a class="btn" href="#">Ir a las propuestas</a><button class="btn-sec" type="button" id="lg-out">Salir de la edición</button></div></section>
${GH.auth.token?`    <form class="box" id="cp"><h3>Cambiar una contraseña</h3>
      <label class="fld" for="cp-u"><span>Usuario</span><select id="cp-u">${names.map(n=>`<option ${n===GH.auth.name?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
      <div class="ed-grid">${pwField("cp-p","Nueva contraseña")}${pwField("cp-q","Repetir contraseña")}</div>
      <p id="cp-m" role="status" style="font-size:14px"></p>
      <div><button class="btn-sec" type="submit">Cambiar contraseña</button></div></form>
    <form class="box" id="rt" style="${GH.auth.token?"":"border:2px solid var(--accent)"}"><h3>${GH.auth.token?"Renovar la llave de GitHub":"Conectar con GitHub (una sola vez)"}</h3>
      <p class="muted">${GH.auth.token?"Solo hace falta cuando la llave vence. Los usuarios y las contraseñas no cambian.":"Para que los cambios se guarden, GitHub exige una llave del repositorio. Se pega una sola vez acá y queda cifrada: después nadie la vuelve a pedir."}</p>
      <label class="fld" for="rt-t"><span>Llave nueva</span><input id="rt-t" type="password" autocomplete="off" spellcheck="false" required></label>
      ${tokenHelp}
      <p id="rt-m" role="status" style="font-size:14px"></p>
      <div><button class="btn-sec" type="submit">Guardar llave nueva</button></div></form>
`:`    <form class="box" id="rt" style="${GH.auth.token?"":"border:2px solid var(--accent)"}"><h3>${GH.auth.token?"Renovar la llave de GitHub":"Conectar con GitHub (una sola vez)"}</h3>
      <p class="muted">${GH.auth.token?"Solo hace falta cuando la llave vence. Los usuarios y las contraseñas no cambian.":"Para que los cambios se guarden, GitHub exige una llave del repositorio. Se pega una sola vez acá y queda cifrada: después nadie la vuelve a pedir."}</p>
      <label class="fld" for="rt-t"><span>Llave nueva</span><input id="rt-t" type="password" autocomplete="off" spellcheck="false" required></label>
      ${tokenHelp}
      <p id="rt-m" role="status" style="font-size:14px"></p>
      <div><button class="btn-sec" type="submit">Guardar llave nueva</button></div></form>
    <form class="box" id="cp"><h3>Cambiar una contraseña</h3>
      <label class="fld" for="cp-u"><span>Usuario</span><select id="cp-u">${names.map(n=>`<option ${n===GH.auth.name?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
      <div class="ed-grid">${pwField("cp-p","Nueva contraseña")}${pwField("cp-q","Repetir contraseña")}</div>
      <p id="cp-m" role="status" style="font-size:14px"></p>
      <div><button class="btn-sec" type="submit">Cambiar contraseña</button></div></form>
`}  </div>`;
  document.getElementById("lg-out").onclick=()=>{GH.auth=null;saveSession();location.hash=""};
  const K=unb64(GH.auth.K);
  document.getElementById("cp").onsubmit=async ev=>{ev.preventDefault();const m=document.getElementById("cp-m"),btn=ev.target.querySelector("button");
    const u=document.getElementById("cp-u").value,p=document.getElementById("cp-p").value,e=checkPw(p,document.getElementById("cp-q").value);
    if(e){setMsg(m,e,true);return}
    btn.disabled=true;setMsg(m,"Guardando…");
    try{const cfg=JSON.parse(JSON.stringify(GH.cfg));cfg.users[u]=await wrapUser(u,p,K);
      await saveCfg(cfg,`Cambio de contraseña de ${u} (por ${GH.auth.name})`);
      ev.target.reset();setMsg(m,`Listo. La contraseña de ${u} cambia en 1 o 2 minutos.`)}
    catch(err){setMsg(m,ghErr(err),true)} btn.disabled=false};
  document.getElementById("rt").onsubmit=async ev=>{ev.preventDefault();const m=document.getElementById("rt-m"),btn=ev.target.querySelector("button");
    const token=document.getElementById("rt-t").value.trim();btn.disabled=true;setMsg(m,"Verificando la llave…");
    try{const branch=await ghCheck(token);
      const cfg=JSON.parse(JSON.stringify(GH.cfg));cfg.branch=branch;cfg.token=await seal(await aesKey(K),tenc.encode(token));
      const a={...GH.auth,token,branch},first=!GH.auth.token;
      await saveCfg(cfg,`${first?"Conectar":"Renovar"} la llave de GitHub (por ${GH.auth.name})`,a);
      GH.auth=a;saveSession();if(first){renderAdmin();return}ev.target.reset();setMsg(m,"Listo. La llave nueva quedó guardada.")}
    catch(err){setMsg(m,err&&err.status===401?"La llave no es válida o venció.":err&&(err.status===403||err.status===404)?"Esa llave no puede escribir en este repositorio.":ghErr(err),true)} btn.disabled=false};
}
</script>
</body></html>
